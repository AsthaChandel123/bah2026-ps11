name: CI

on:
  push:
    branches: [claude/blissful-babbage-sn0qr4]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install faiss-cpu numpy scipy scikit-learn pyyaml pillow tqdm pytest

      - name: Run test suite
        run: python -m pytest -q

      - name: Run smoke-test
        run: python -m xsretrieval.cli smoke-test
